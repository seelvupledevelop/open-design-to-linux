appId: io.open-design.desktop
productName: Open Design

# The upstream macOS bundle ships Resources/app unpacked (no asar); keep the
# same layout on Linux so native modules keep working without smart-unpack
# surprise-pruning anything.
asar: false

directories:
  app: app
  output: packages

# Files the main process resolves via process.resourcesPath (open-design assets,
# web-standalone server, dom-to-pptx) are staged by scripts/port-app-dir.sh and
# placed into the Linux Resources root, same relative layout as upstream macOS.
extraResources:
  - from: resources-extra
    to: .
    filter:
      - "**/*"

files:
  - "**/*"

linux:
  category: Graphics
  icon: packaging/icon.png
  artifactName: Open-Design-${version}-${arch}.${ext}
  # Sign-in/invite deep links come back from the browser as opendesign:// URLs.
  # electron-builder silently drops MimeType from desktop entry snippets — set
  # it via this top-level option so the deb ships a working scheme handler.
  mimeTypes:
    - x-scheme-handler/opendesign
  target:
    - target: deb
      arch: x64
    - target: AppImage
      arch: x64

deb:
  artifactName: open-design_${version}_amd64.${ext}
